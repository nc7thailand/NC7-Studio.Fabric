server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run / custom domain: do not rewrite Location to an internal host:port
    absolute_redirect off;
    port_in_redirect off;

    # Hashed Vite assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static files from /public (favicon, dummy SVGs, etc.)
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Health for Cloud Run / load balancers
    location = /health {
        default_type text/plain;
        return 200 'OK';
    }

    # SPA / path-based client routes: /, /editor, /vectorcore
    # No auth redirects here — suite login lives on nc7foamart.com; cookies use Domain=.nc7foamart.com
    location / {
        try_files $uri $uri/ /index.html;
    }
}
