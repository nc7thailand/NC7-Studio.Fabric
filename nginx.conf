server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static files from /public (favicon, dummy SVGs, etc.)
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA / path-based client routes: /, /editor, /vectorcore
    location / {
        try_files $uri $uri/ /index.html;
    }
}
